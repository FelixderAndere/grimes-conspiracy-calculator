<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grimes Conspiracy Calculator</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #101217;
      --panel: #171a22;
      --panel-strong: #1b1f29;
      --line: #2e3443;
      --line-2: #3d475a;
      --text: #e7ebf5;
      --text-soft: #a6afc2;
      --accent: #6fd5ff;
      --accent-2: #8ef0c8;
      --danger: #ff7f9f;
      --shadow: 0 14px 35px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app-shell {
      width: min(1400px, calc(100vw - 2rem));
      margin: 0.6rem auto 1rem;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(300px, 370px) minmax(0, 1fr);
      gap: 1rem;
      min-height: calc(100vh - 2rem);
    }

    .page-header {
      width: min(1400px, calc(100vw - 2rem));
      margin: 1rem auto 0.45rem;
      padding: 0.35rem 0;
      text-align: center;
    }

    .panel {
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 1rem;
    }

    .input-panel {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .output-panel {
      background: var(--panel-strong);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 0.9rem;
      min-width: 0;
    }

    .panel-description {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-soft);
      padding-bottom: 0.65rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2vw, 1.7rem);
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--text-soft);
      font-size: 0.93rem;
      line-height: 1.45;
    }

    .input-group {
      border-top: 1px solid var(--line);
      padding-top: 0.75rem;
    }

    .group-title {
      margin: 0 0 0.6rem;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--text-soft);
      font-weight: 700;
    }

    .stack {
      display: grid;
      gap: 0.65rem;
    }

    .field label {
      display: block;
      font-size: 0.86rem;
      color: #ccdaf8;
      margin-bottom: 0.32rem;
    }

    input, select, button {
      width: 100%;
      font: inherit;
      color: var(--text);
      border: 1px solid var(--line-2);
      background: #101a2e;
      border-radius: 11px;
      padding: 0.58rem 0.62rem;
      outline: none;
      transition: border-color 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(83, 216, 255, 0.15);
    }

    button {
      font-weight: 700;
      border: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06111c;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(83, 216, 255, 0.22);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(83, 216, 255, 0.3);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.8rem;
      margin-bottom: 0.4rem;
    }

    .result-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.8rem;
      min-height: 90px;
    }

    .result-label {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--text-soft);
      margin-bottom: 0.42rem;
      font-weight: 700;
    }

    .results {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.94rem;
      line-height: 1.4;
      color: #f0f6ff;
    }

    .error {
      min-height: 1.2rem;
      color: var(--danger);
      font-size: 0.88rem;
      margin-top: 0.35rem;
    }

    #plot {
      height: 100%;
      min-height: 460px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .is-hidden {
      display: none;
    }

    @media (max-width: 1024px) {
      .app-shell {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .results-grid {
        grid-template-columns: 1fr;
      }

      #plot {
        min-height: 390px;
      }
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Grimes Conspiracy Calculator</h1>
    <p class="subtitle">Leak probability model from <em>On the Viability of Conspiratorial Beliefs</em> by David Robert Grimes.</p>
  </header>

  <main class="app-shell">

    <section class="panel input-panel">
      <p class="panel-description">Parameter Input</p>
      <section class="input-group">
        <h2 class="group-title">Model Selection</h2>
        <div class="stack">
          <div class="field">
            <label for="mode">Model type</label>
            <select id="mode">
              <option value="stable">Stable N (N(t) = N₀)</option>
              <option value="gompertz">Changing N (N(t) = Gompertz(N₀, α, β, avg(tN)))</option>
            </select>
          </div>
        </div>
      </section>

      <section class="input-group">
        <h2 class="group-title">Core Parameters</h2>
        <div class="stack">
          <div class="field">
            <label for="p">Per-person per year leak probability p</label>
            <input id="p" type="number" step="any" value="0.000004" />
          </div>
          <div class="field">
            <label for="n">Initial people N₀</label>
            <input id="n" type="number" step="1" value="1000" />
          </div>
          <div class="field">
            <label for="t">Time t [years]</label>
            <input id="t" type="number" step="0.1" value="100" />
          </div>
        </div>
      </section>

      <section class="input-group" id="gompertzFields">
        <h2 class="group-title">Gompertz Parameters</h2>
        <div class="stack">
          <div class="field">
            <label for="alpha">Gompertz α (Baseline level mortality)</label>
            <input id="alpha" type="number" step="any" value="0.0005" />
          </div>
          <div class="field">
            <label for="beta">Gompertz β (Mortality increase per year of life)</label>
            <input id="beta" type="number" step="any" value="0.08" />
          </div>
          <div class="field">
            <label for="avgAge">Average age at t = 0 [years]</label>
            <input id="avgAge" type="number" step="0.1" value="40" />
          </div>
        </div>
      </section>

      <section class="input-group">
        <h2 class="group-title">Reverse Solve</h2>
        <div class="stack">
          <div class="field">
            <label for="targetL">Target leak probability L(t)</label>
            <input id="targetL" type="number" min="0" max="0.999999999" step="0.0001" value="0.5" />
          </div>
          <div class="field">
            <label for="reverseType">Solve for</label>
            <select id="reverseType">
              <option value="n">max(N₀) from L(t), p, t</option>
              <option value="t">max(t) from L(t), p, N₀</option>
            </select>
          </div>
        </div>
      </section>
    </section>

    <section class="panel output-panel">
      <div>
        <p class="panel-description">Output</p>
        <div class="results-grid">
          <article class="result-card">
            <div class="result-label">Forward Result</div>
            <div class="results" id="forwardResult"></div>
          </article>
          <article class="result-card">
            <div class="result-label">Reverse Result</div>
            <div class="results" id="reverseResult"></div>
          </article>
        </div>
        <div class="error" id="error"></div>
      </div>

      <div id="plot"></div>
    </section>
  </main>

  <script>
    const modeEl = document.getElementById('mode');
    const pEl = document.getElementById('p');
    const nEl = document.getElementById('n');
    const tEl = document.getElementById('t');
    const alphaEl = document.getElementById('alpha');
    const betaEl = document.getElementById('beta');
    const avgAgeEl = document.getElementById('avgAge');
    const targetLEl = document.getElementById('targetL');
    const reverseTypeEl = document.getElementById('reverseType');
    const gompertzFields = document.getElementById('gompertzFields');
    const forwardResult = document.getElementById('forwardResult');
    const reverseResult = document.getElementById('reverseResult');
    const errorEl = document.getElementById('error');

    function parsePositive(value, name, allowZero = false) {
      const n = Number(value);
      if (!Number.isFinite(n) || (allowZero ? n < 0 : n <= 0)) {
        throw new Error(`${name} must be ${allowZero ? 'non-negative' : 'positive'}.`);
      }
      return n;
    }

    function gompertzPopulationFactor(t, alpha, beta, averageAge = 0) {
      const ageStart = Math.exp(beta * averageAge);
      const ageEnd = Math.exp(beta * (averageAge + t));
      return Math.exp(-(alpha / beta) * (ageEnd - ageStart));
    }

    function integrateGompertzUnit(t, alpha, beta, averageAge = 0, steps = 2000) {
      if (t === 0) return 0;
      const h = t / steps;
      let total = 0;
      for (let i = 0; i <= steps; i++) {
        const x = i * h;
        const fx = gompertzPopulationFactor(x, alpha, beta, averageAge);
        if (i === 0 || i === steps) total += fx;
        else if (i % 2 === 0) total += 2 * fx;
        else total += 4 * fx;
      }
      return total * h / 3;
    }

    function leakStable(p, n, t) {
      return 1 - Math.exp(-p * n * t);
    }

    function leakGompertz(p, n0, t, alpha, beta, averageAge = 0) {
      const integral = integrateGompertzUnit(t, alpha, beta, averageAge);
      return 1 - Math.exp(-p * n0 * integral);
    }

    function maxNStable(targetL, p, t) {
      if (targetL === 0) return 0;
      if (t <= 0) throw new Error('t must be positive to solve max N when target L(t) > 0.');
      return -Math.log(1 - targetL) / (p * t);
    }

    function maxTStable(targetL, p, n) {
      return -Math.log(1 - targetL) / (p * n);
    }

    function maxNGompertz(targetL, p, t, alpha, beta, averageAge = 0) {
      if (targetL === 0) return 0;
      const unitIntegral = integrateGompertzUnit(t, alpha, beta, averageAge);
      if (unitIntegral <= 0) throw new Error('t must be positive to solve max N when target L(t) > 0.');
      return -Math.log(1 - targetL) / (p * unitIntegral);
    }

    function maxTGompertz(targetL, p, n0, alpha, beta, averageAge = 0) {
      const target = -Math.log(1 - targetL);
      let lo = 0;
      let hi = 1;
      while (p * n0 * integrateGompertzUnit(hi, alpha, beta, averageAge) < target && hi < 1e6) {
        hi *= 2;
      }
      for (let i = 0; i < 80; i++) {
        const mid = (lo + hi) / 2;
        const v = p * n0 * integrateGompertzUnit(mid, alpha, beta, averageAge);
        if (v >= target) hi = mid;
        else lo = mid;
      }
      return hi;
    }

    function formatPercent(x) {
      return `${(x * 100).toFixed(6)}%`;
    }

    function calculate() {
      try {
        errorEl.textContent = '';
        const mode = modeEl.value;
        const p = parsePositive(pEl.value, 'p');
        const n = parsePositive(nEl.value, 'N₀');
        const t = parsePositive(tEl.value, 't', true);
        const targetL = Number(targetLEl.value);

        if (!Number.isFinite(targetL) || targetL < 0 || targetL >= 1) {
          throw new Error('Target L(t) must be in [0, 1].');
        }

        let forward;
        let reverse;

        if (mode === 'stable') {
          forward = leakStable(p, n, t);
          reverse = reverseTypeEl.value === 'n'
            ? maxNStable(targetL, p, t)
            : maxTStable(targetL, p, n);
        } else {
          const alpha = parsePositive(alphaEl.value, 'alpha', true);
          const beta = parsePositive(betaEl.value, 'beta');
          const averageAge = parsePositive(avgAgeEl.value, 'average age', true);
          forward = leakGompertz(p, n, t, alpha, beta, averageAge);
          reverse = reverseTypeEl.value === 'n'
            ? maxNGompertz(targetL, p, t, alpha, beta, averageAge)
            : maxTGompertz(targetL, p, n, alpha, beta, averageAge);
        }

        forwardResult.textContent = `L(${t.toFixed(2)}) = ${forward.toFixed(4)*100}% (${forward.toPrecision(6)})`;
        reverseResult.textContent = reverseTypeEl.value === 'n'
          ? `max(N₀) ≈ ${reverse.toLocaleString(undefined, { maximumFractionDigits: 1 })}`
          : `max(t) ≈ ${reverse.toLocaleString(undefined, { maximumFractionDigits: 6 })} years`;

        renderPlot();
      } catch (err) {
        forwardResult.textContent = '';
        reverseResult.textContent = '';
        errorEl.textContent = err.message;
      }
    }

    function renderPlot() {
      const mode = modeEl.value;
      const p = Number(pEl.value);
      const n = Number(nEl.value);
      const maxT = Math.max(0.1, Number(tEl.value));
      const alpha = Number(alphaEl.value);
      const beta = Number(betaEl.value);
      const averageAge = Number(avgAgeEl.value);

      const steps = 200;
      const xs = [];
      const ys = [];
      const ns = [];

      for (let i = 0; i <= steps; i++) {
        const x = (maxT * i) / steps;
        xs.push(x);
        if (mode === 'stable') {
          ys.push(leakStable(p, n, x));
          ns.push(n);
        } else {
          ys.push(leakGompertz(p, n, x, alpha, beta, averageAge));
          ns.push(n * gompertzPopulationFactor(x, alpha, beta, averageAge));
        }
      }

      const maxLeak = Math.max(...ys);
      const yMaxLeak = maxLeak > 0 ? maxLeak : 0.000001;

      Plotly.newPlot('plot', [
        { x: xs, y: ys, mode: 'lines', name: 'L(t)', line: { width: 3 } },
        { x: xs, y: ns, mode: 'lines', name: 'N(t)', yaxis: 'y2', line: { dash: 'dot' } }
      ], {
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        font: { color: '#e9f0ff', family: 'Space Grotesk, Segoe UI, sans-serif' },
        xaxis: {
          title: 't [years]',
          gridcolor: 'rgba(149, 172, 219, 0.16)',
          zerolinecolor: 'rgba(149, 172, 219, 0.2)'
        },
        yaxis: {
          title: 'L(t)',
          range: [0, yMaxLeak],
          zeroline: true,
          zerolinewidth: 1,
          gridcolor: 'rgba(149, 172, 219, 0.16)',
          zerolinecolor: 'rgba(149, 172, 219, 0.2)'
        },
        yaxis2: {
          title: 'N(t)',
          overlaying: 'y',
          side: 'right',
          rangemode: 'tozero',
          zeroline: true,
          zerolinewidth: 1,
          gridcolor: 'rgba(149, 172, 219, 0.12)',
          zerolinecolor: 'rgba(149, 172, 219, 0.18)'
        },
        legend: { orientation: 'h' },
        margin: { t: 16, r: 46, b: 44, l: 52 }
      }, { responsive: true });
    }

    function toggleGompertz() {
      const isG = modeEl.value === 'gompertz';
      gompertzFields.classList.toggle('is-hidden', !isG);
      calculate();
    }

    [pEl, nEl, tEl, alphaEl, betaEl, avgAgeEl, targetLEl].forEach((el) => {
      el.addEventListener('input', calculate);
      el.addEventListener('change', calculate);
    });

    [modeEl, reverseTypeEl].forEach((el) => {
      el.addEventListener('change', calculate);
    });

    modeEl.addEventListener('change', toggleGompertz);
    toggleGompertz();
  </script>
</body>
</html>
